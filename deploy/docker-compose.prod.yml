# Production stack for one small Linux server (docs/deploy.md).
# Run from the repo root, always with the root .env:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
# (or the `make prod-*` targets, which wrap exactly that).
#
#   db        Postgres 16, NOT published: reachable only on this compose network
#   metabase  pinned like the laptop; its app data lives in Postgres
#             (database metabase_app), not H2; admin only via SSH tunnel
#             to 127.0.0.1:3000
#   caddy     the only thing on 80/443; forwards public-dashboard paths only
#   pipeline  the job image, run on demand / by systemd:
#             docker compose ... run --rm pipeline python -m src.pipeline.daily
name: jobmarket

# The long-running services rotate their container logs (Caddy writes its
# access log to stdout): the local driver keeps 5 x 20 MB per container.
x-logging: &logging
  driver: local

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobmarket
      # read by initdb/10-metabase-app.sh (fresh volume) and
      # ensure_metabase_db.sh (existing volume)
      METABASE_APP_DB_PASSWORD: ${METABASE_APP_DB_PASSWORD:?set METABASE_APP_DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmarket"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no `ports:` on purpose -- never expose Postgres on a public server

  metabase:
    image: metabase/metabase:v0.64.3.4  # same pin as the laptop's docker-compose.yml
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:?set METABASE_APP_DB_PASSWORD in .env}
      MB_SITE_URL: ${MB_SITE_URL:?set MB_SITE_URL in .env}
      MB_ANON_TRACKING_ENABLED: "false"
      # heap for a 4 GB server (parked: docs/overnight-deploy-kit.md)
      JAVA_OPTS: "-Xmx${METABASE_JAVA_HEAP:-1536m}"
    ports:
      - "127.0.0.1:3000:3000"  # server-local only: admin through an SSH tunnel
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - metabase
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  pipeline:
    image: job-market-tracker:local
    build:
      context: ..
    profiles: ["job"]
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      # these win over .env: inside the stack the database is host `db`
      # JOBMARKET_DB: leave unset (jobmarket); a *_demo name is for testing the stack
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${JOBMARKET_DB:-jobmarket}
      METABASE_URL: http://metabase:3000
      METABASE_DB_HOST: db
    volumes:
      - pipeline_state:/var/lib/jobmarket  # the runner's logs/ and data/

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  pipeline_state:
