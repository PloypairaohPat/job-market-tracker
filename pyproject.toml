[project]
name = "job-market-tracker"
version = "0.1.0"
description = "A self-hosted analytics platform tracking the data analytics job market: ingestion, cleaning, skill/salary intelligence, and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pandas>=2.1",
    "openpyxl>=3.1",  # .xlsx reader for DOL LCA disclosure files
    "plotly>=5.18",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # long lines allowed in docstrings / SQL

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Postgres (set TEST_DATABASE_URL)",
]
